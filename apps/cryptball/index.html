<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111720" />
    <title>Cryptball · Six Teams</title>
  </head>
  <body>
    <main id="game" aria-label="Cryptball">
      <div id="stage"></div>
      <div id="hud" aria-label="Scoreboard">
        <span id="ivory">RAMS 0</span><span id="clock">1:30</span
        ><span id="ember">0 FOXES</span>
      </div>
      <div id="prompt"></div>
      <section id="overlay" aria-label="Game menu"></section>
      <p id="notice" role="status" aria-live="polite"></p>
    </main>
    <section id="orientation-gate" role="dialog" aria-modal="true" aria-labelledby="orientation-title" hidden>
      <h2 id="orientation-title">Rotate to play</h2>
      <p>Turn your phone sideways, then resume when ready.</p>
      <button id="portrait-continue">Continue in portrait</button>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
