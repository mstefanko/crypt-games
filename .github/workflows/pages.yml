name: Publish Crypt Games
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crypt-games-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:cryptball
        env:
          CRYPTBALL_BASE_PATH: /crypt-games/
          VITE_CRYPTBALL_SERVER: ${{ vars.VITE_CRYPTBALL_SERVER }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .local-game-tests/cryptball
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
